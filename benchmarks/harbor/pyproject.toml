[project]
name = "book-harbor"
version = "0.1.0"
description = "Harbor installed-agent adapter that runs the Book CLI on Terminal-Bench and other Harbor datasets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["harbor>=0.23.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/book_harbor"]
