name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: read

jobs:
  check:
    name: Check (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # TEMPORARY diagnostic for the windows/Node 24 worker crash. Remove before merge.
      # The two fs.watch files crash even when run alone, so this narrows *why*: is it fs.watch
      # itself on this OS image, or the interaction with vitest's forks pool?
      - name: 'DIAGNOSTIC: narrow the fs.watch worker crash'
        if: matrix.os == 'windows-latest' && matrix.node-version == '24.x'
        continue-on-error: true
        shell: bash
        run: |
          set +e   # GitHub runs bash with -e; without this the first failure ends the step.
          B="src/skill-watcher.test.ts src/session/runtime.test.ts"
          V="npx vitest run --config vitest.unit.config.ts"
          echo "===== 1. baseline: both files, forks pool ====="
          $V $B; echo "exit=$?"
          echo "===== 2. skill-watcher alone ====="
          $V src/skill-watcher.test.ts; echo "exit=$?"
          echo "===== 3. runtime alone ====="
          $V src/session/runtime.test.ts; echo "exit=$?"
          echo "===== 4. both, threads pool ====="
          $V --pool=threads $B; echo "exit=$?"
          echo "===== 5. both, forks + no isolation ====="
          $V --no-isolate $B; echo "exit=$?"
          echo "===== 6. fs.watch outside vitest entirely ====="
          cat > diag-watch.mjs <<'JS'
          import { mkdirSync, mkdtempSync, rmSync, writeFileSync, watch } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          const ws = mkdtempSync(join(tmpdir(), 'diag-watch-'));
          const dir = join(ws, '.book', 'skills', 'review');
          mkdirSync(dir, { recursive: true });
          const handles = [];
          for (const d of [ws, join(ws, '.book'), join(ws, '.book', 'skills'), dir]) {
            const w = watch(d, () => {});
            w.on('error', (e) => console.log('watcher error', e.code ?? e.message));
            handles.push(w);
          }
          writeFileSync(join(dir, 'SKILL.md'), 'body');
          setTimeout(() => {
            for (const w of handles) w.close();
            rmSync(ws, { recursive: true, force: true });
            console.log('plain-node fs.watch OK');
          }, 300);
          JS
          node diag-watch.mjs; echo "exit=$?"
          echo "===== 7. node version / os ====="
          node -p "process.version + ' ' + process.platform + ' ' + require('os').release()"
          rm -f diag-watch.mjs

      - run: npm run check

      - run: npm run build

      - run: npm run test:integration

      - run: npm run package:smoke

      - run: npm run audit:prod

      - run: npm run audit:all

  package:
    name: Package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - run: npm run release:check

  quality-ratchet:
    name: Coverage and UI budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - run: npm run test:coverage

      - run: npm run bench:ui

  stability-policy:
    name: Stability policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - run: npm run stabilization:check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STABILIZATION_REQUIRED_GREEN_RUNS: '3'
          STABILIZATION_WORKFLOW: ci.yml
          STABILIZATION_BRANCH: main
          STABILIZATION_REGRESSION_LABELS: regression:lifecycle,regression:accounting
