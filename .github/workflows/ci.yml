name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: read

jobs:
  check:
    name: Check (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The low leg is pinned to the declared `engines.node` floor, not `22.x`.
        # `22.x` resolves to the newest 22, so a dependency that quietly raises the
        # floor above our declared minimum still goes green -- which is how undici 8's
        # `>=22.19.0` requirement reached main under a `>=22.13.0` declaration.
        node-version: [22.19.x, 24.x]
        # The floor leg cannot see what only newer 22 releases do. `NODE_USE_ENV_PROXY`
        # exists only on later 22.x, so 22.19 cannot exercise the path the #146 proxy
        # regression broke (undici 8 replacing the dispatcher Node's own `fetch` uses);
        # it was reproduced on 22.23.3. One leg on the newest 22 covers that. It is Linux
        # only: the dispatcher behaviour is not platform-specific, and a Windows leg would
        # add another run of the Windows-only flakes to the Stability policy's green-run
        # window.
        include:
          - os: ubuntu-latest
            node-version: 22.x

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # npm 10 (Node 22) retries a failed bulk audit against the retired `audits/quick` endpoint
      # and reports that endpoint's 400, hiding a transient error as a permanent one; npm 11 does
      # not (#598). Every leg audits with the same npm.
      - run: npm install -g npm@11.20.0

      - run: npm ci

      - run: npm run check

      - run: npm run build

      - run: npm run test:integration

      - run: npm run package:smoke

      - run: npm run audit:prod

      - run: npm run audit:all

  package:
    name: Package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - run: npm run release:check

  quality-ratchet:
    name: Coverage and UI budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - run: npm run test:coverage

      - run: npm run bench:ui

  stability-policy:
    name: Stability policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - run: npm run stabilization:check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STABILIZATION_REQUIRED_GREEN_RUNS: '3'
          STABILIZATION_WORKFLOW: ci.yml
          STABILIZATION_BRANCH: main
          STABILIZATION_REGRESSION_LABELS: regression:lifecycle,regression:accounting

  # The macOS sandbox backend (Seatbelt) is proven only here: the darwin suite in
  # src/sandbox-seatbelt.test.ts spawns a real sandbox-exec. A job of its own rather
  # than a matrix leg, so an unrelated macOS failure cannot turn the Stability policy
  # red, and it runs the sandbox test files only.
  sandbox-macos:
    name: Sandbox (macOS Seatbelt)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      - run: >-
          npx vitest run --config vitest.unit.config.ts
          --reporter=default --reporter=json --outputFile.json=sandbox-results.json
          src/sandbox-seatbelt.test.ts src/sandbox.test.ts

      # A darwin test that was skipped is not proof. Fail unless the real-sandbox
      # suite ran and every test in it passed.
      - run: >-
          node -e "const r = require('./sandbox-results.json');
          const t = r.testResults.flatMap((f) => f.assertionResults)
          .filter((a) => a.ancestorTitles.includes('the Seatbelt sandbox on a real Mac'));
          const passed = t.filter((a) => a.status === 'passed').length;
          console.log('Seatbelt tests passed on this Mac:', passed, 'of', t.length);
          if (t.length < 20 || passed !== t.length) process.exit(1);"
