name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: read

jobs:
  check:
    name: Check (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # TEMPORARY diagnostic for the windows/Node 24 worker crash. Remove before merge.
      # Discriminates: do the two fs.watch files crash alone, or only after the rest of the tier?
      - name: 'DIAGNOSTIC: isolate the fs.watch unit files'
        if: matrix.os == 'windows-latest' && matrix.node-version == '24.x'
        continue-on-error: true
        shell: bash
        run: |
          V="npx vitest run --config vitest.unit.config.ts"
          echo "--- both files together ---"
          $V src/skill-watcher.test.ts src/session/runtime.test.ts; echo "exit=$?"
          echo "--- skill-watcher.test.ts alone ---"
          $V src/skill-watcher.test.ts; echo "exit=$?"
          echo "--- session/runtime.test.ts alone ---"
          $V src/session/runtime.test.ts; echo "exit=$?"
          # mergeConfig concatenates `exclude`, so the unit tier's own exclusions are preserved.
          cat > vitest.diag.config.ts <<'CFG'
          import { defineConfig, mergeConfig } from 'vitest/config';
          import unitConfig from './vitest.unit.config.js';
          export default mergeConfig(
            unitConfig,
            defineConfig({
              test: { exclude: ['src/skill-watcher.test.ts', 'src/session/runtime.test.ts'] },
            }),
          );
          CFG
          echo "--- full tier EXCLUDING both files ---"
          npx vitest run --config vitest.diag.config.ts; echo "exit=$?"
          rm -f vitest.diag.config.ts

      - run: npm run check

      - run: npm run build

      - run: npm run test:integration

      - run: npm run package:smoke

      - run: npm run audit:prod

      - run: npm run audit:all

  package:
    name: Package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - run: npm run release:check

  quality-ratchet:
    name: Coverage and UI budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - run: npm run test:coverage

      - run: npm run bench:ui

  stability-policy:
    name: Stability policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - run: npm run stabilization:check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STABILIZATION_REQUIRED_GREEN_RUNS: '3'
          STABILIZATION_WORKFLOW: ci.yml
          STABILIZATION_BRANCH: main
          STABILIZATION_REGRESSION_LABELS: regression:lifecycle,regression:accounting
