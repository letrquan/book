name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: read

jobs:
  check:
    name: Check (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # TEMPORARY diagnostic. Remove before merge.
      # Cause found: libuv aborts via `Assertion failed: !_wcsnicmp(filename, dir, dirlen)` in
      # src/win/fs-event.c when the watched path is not what Windows canonicalizes it to. This
      # records the runner's paths and proves canonicalizing fixes it.
      - name: 'DIAGNOSTIC: confirm the libuv fs-event path mismatch'
        if: matrix.os == 'windows-latest' && matrix.node-version == '24.x'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          echo "===== runner paths ====="
          node -e "
          const {realpathSync}=require('node:fs'), os=require('node:os');
          const t=os.tmpdir();
          console.log('TEMP env :', process.env.TEMP);
          console.log('tmpdir() :', t);
          console.log('realpath :', realpathSync.native(t));
          console.log('differs  :', t !== realpathSync.native(t));
          "
          echo "===== raw mkdtemp path vs canonicalized (plain node) ====="
          cat > diag-cmp.mjs <<'JS'
          import { mkdtempSync, realpathSync, mkdirSync, writeFileSync, watch, rmSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          const mode = process.argv[2];
          const raw = mkdtempSync(join(tmpdir(), 'diag-cmp-'));
          const ws = mode === 'canonical' ? realpathSync.native(raw) : raw;
          console.log(`${mode}: watching ${ws}`);
          const dir = join(ws, '.book', 'skills', 'review');
          mkdirSync(dir, { recursive: true });
          const handles = [ws, join(ws, '.book'), join(ws, '.book', 'skills'), dir].map((d) =>
            watch(d, () => {}),
          );
          writeFileSync(join(dir, 'SKILL.md'), 'body');
          setTimeout(() => {
            for (const h of handles) h.close();
            rmSync(raw, { recursive: true, force: true });
            console.log(`${mode}: SURVIVED`);
          }, 300);
          JS
          node diag-cmp.mjs raw;       echo "exit=$?"
          node diag-cmp.mjs canonical; echo "exit=$?"
          rm -f diag-cmp.mjs
          echo "===== the two real test files, with the fix in place ====="
          npx vitest run --config vitest.unit.config.ts \
            src/skill-watcher.test.ts src/session/runtime.test.ts; echo "exit=$?"

      - run: npm run check

      - run: npm run build

      - run: npm run test:integration

      - run: npm run package:smoke

      - run: npm run audit:prod

      - run: npm run audit:all

  package:
    name: Package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - run: npm run release:check

  quality-ratchet:
    name: Coverage and UI budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - run: npm run test:coverage

      - run: npm run bench:ui

  stability-policy:
    name: Stability policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - run: npm run stabilization:check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STABILIZATION_REQUIRED_GREEN_RUNS: '3'
          STABILIZATION_WORKFLOW: ci.yml
          STABILIZATION_BRANCH: main
          STABILIZATION_REGRESSION_LABELS: regression:lifecycle,regression:accounting
